<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDOKU-GAME!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 >SUDOKU GAME!</h1>
    
    <!-- sudoku user input box -->
     <div id="box">
        <p id="list"></p>
     </div>

    <main>
       <div id="board" class="Sudoku-board"></div> 
    </main>

    
    
    
    <div id="btn-container">
        <button id="new">New Game</button>
        <button id="check">Check</button>
        <button id="reset">Reset</button>
    </div>

    <p id="message"></p>

    <h3>Please Select the Level of Sudoku</h3>
    <div id="level">
        <button id="easy">Easy</button>
        <button id="medium">Medium</button>
        <button id="hard">Hard</button>
    </div>

    <!-- custom alert pop -->
     <div id="custom-alert">
        <p id="alert-message"></p>
        <button id="alert-btn">OK</button>
     </div>
     
     <!-- custom giveUp pop alert -->
     <div id="custom-alert1">
        <p id="alert-message1"></p>
        <button id="alert-btn1">OK</button>
     </div>

     <button id="giveUp-btn">Give Up!</button>
    
    <script src="script.js"></script>
     <!-- <script src="script2.js"></script> -->
</body>
</html>
